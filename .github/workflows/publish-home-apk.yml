name: Publish home APK

on:
  workflow_run:
    workflows: ['Build home APK']
    types: [completed]
    branches: ['feature/android-home-tailscale']
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build home APK run ID to publish
        required: true
        type: string

concurrency:
  group: home-apk-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.repository == 'Frank-jpeg/FlClash' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      EXPECTED_CERT: d09e03af6407a2a0041c60bc07055680d4da39861b7a5b3cd82dbcb8c2d1d555
    steps:
      - name: Validate build and read version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .head_repository.full_name == $repo and
            .head_branch == "feature/android-home-tailscale" and
            .path == ".github/workflows/build-home-apk.yml" and
            (.event == "push" or .event == "workflow_dispatch")
          ' run.json > /dev/null
          sha=$(jq -r .head_sha run.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/contents/pubspec.yaml?ref=$sha" --jq .content | base64 --decode > pubspec.yaml
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('pubspec.yaml').read_text()
          match = re.search(r'^version: ([0-9]+\.[0-9]+\.[0-9]+-home\.[0-9]+)\+([0-9]+)\s*$', text, re.M)
          if not match:
              raise SystemExit('Expected a versioned Android Home build')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={match[1]}\nbuild={match[2]}\ntag=v{match[1]}\n')
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "FlClash-home-$sha" --dir input
          test "$(find input -type f -name '*.apk' | wc -l)" -eq 2
          test -f input/app-arm64-v8a-release.apk
          test -f input/app-x86_64-release.apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sign and verify APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HOME_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.HOME_ANDROID_SIGNING_PASSWORD }}
          VERSION: ${{ steps.source.outputs.version }}
          BUILD_NUMBER: ${{ steps.source.outputs.build }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_PASSWORD"
          export SIGNING_PASSWORD="$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n')"
          umask 077
          keystore="$RUNNER_TEMP/flclash-home.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$keystore"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          aapt="$(dirname "$signer")/aapt"
          mkdir -p dist
          for abi in arm64-v8a x86_64; do
            apk="dist/FlClash-home-$abi.apk"
            echo "Signing and checking $abi"
            "$signer" sign --ks "$keystore" --ks-key-alias flclash-home \
              --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
              --out "$apk" "input/app-$abi-release.apk"
            "$signer" verify --verbose --print-certs "$apk" | tee signature.txt
            grep -Fx 'Number of signers: 1' signature.txt
            certificates=$(sed -n 's/^.*certificate SHA-256 digest: //p' signature.txt | sort -u)
            test "$certificates" = "$EXPECTED_CERT"
            "$aapt" dump badging "$apk" > badging.txt
            if [[ "$abi" == arm64-v8a ]]; then offset=2000; else offset=4000; fi
            code=$((BUILD_NUMBER + offset))
            grep -F "package: name='com.follow.clash.home' versionCode='$code' versionName='$VERSION'" badging.txt
            grep -Fx "native-code: '$abi'" badging.txt
          done
          (cd dist && sha256sum ./*.apk | sed 's|  ./|  |' > SHA256SUMS.txt)

      - name: Publish APK download links
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json > /dev/null
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish,isDraft > release.json 2>/dev/null; then
            if jq -e .isDraft release.json > /dev/null; then
              jq -e --arg sha "$SOURCE_SHA" '.targetCommitish == $sha' release.json > /dev/null
            else
              test -s tag.json
              jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json > /dev/null
            fi
          else
            cat > notes.md <<EOF
          FlClash 安卓首页版 $VERSION

          安卓手机选择 FlClash-home-arm64-v8a.apk，x86_64 模拟器选择 FlClash-home-x86_64.apk。
          APK 沿用首页版固定签名，可覆盖之前的固定签名首页版，无需解压。

          构建：https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID
          源码：$SOURCE_SHA（保留上游 GPL-3.0 许可证与署名）
          使用说明：https://github.com/$GITHUB_REPOSITORY/blob/feature/android-home-tailscale/docs/HOME-ANDROID.md
          EOF
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --draft --title "FlClash 安卓首页版 $VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name > latest.txt 2>/dev/null || : > latest.txt
          make_latest=$(python3 - <<'PY'
          import os, pathlib, re
          def version(value):
              match = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)-home\.([0-9]+)', value)
              return tuple(map(int, match.groups())) if match else ()
          print(str(version(os.environ['TAG']) >= version(pathlib.Path('latest.txt').read_text().strip())).lower())
          PY
          )
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/FlClash-home-arm64-v8a.apk" >> "$GITHUB_STEP_SUMMARY"
